<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SubTrack — Hero V3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: #060606;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
}

/* ── Outer wrapper — holds crop + fade overlay ── */
.outer {
  position: relative;
  height: 320px;
}

/* Clips only the bottom; sides are free */
.crop {
  height: 320px;
  clip-path: inset(0 -600px 0 -600px);
}

/* Gradient fade over the bottom cut — sits outside clip scope */
.fade-bottom {
  position: absolute;
  bottom: 0;
  left: -400px; right: -400px;
  height: 110px;
  background: linear-gradient(to top, #060606 25%, transparent);
  pointer-events: none;
  z-index: 200;
}

/* ── Scene ── */
.scene {
  perspective: 760px;
  perspective-origin: 50% 40%;
}

/* ── Phone 3D box ── */
.phone-box {
  position: relative;
  width: 234px;
  height: 440px;
  transform-style: preserve-3d;
  transform: rotateY(-38deg) rotateX(16deg);
  filter: drop-shadow(-18px 36px 64px rgba(0,0,0,0.95));
}

/* ── Top face ── */
.face-top {
  position: absolute;
  top: 0; left: 0;
  width: 234px; height: 30px;
  transform-origin: 50% 0 0;
  transform: rotateX(-90deg);
  background: linear-gradient(to bottom,
    #2a2a2a 0%,
    #222 40%,
    #1a1a1a 100%
  );
  border-radius: 6px 6px 0 0;
  overflow: hidden;
}
.face-top::after {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%; height: 1px;
  background: linear-gradient(to right, transparent, #404040 30%, #484848 50%, #404040 70%, transparent);
}

/* ── Front face ── */
.face-front {
  position: absolute;
  width: 234px; height: 440px;
  transform: translateZ(15px);
  border-radius: 36px;
  background: #0f0f0f;
  border: 1.5px solid #1e1e1e;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px #1a1a1a;
}
.face-front::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: 36px;
  background: linear-gradient(125deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 28%, transparent 50%);
  pointer-events: none; z-index: 30;
}

/* ── Left side ── */
.face-left {
  position: absolute;
  left: 0; top: 0;
  width: 30px; height: 440px;
  transform-origin: 0 50% 0;
  transform: rotateY(-90deg);
  background: linear-gradient(to right,
    #0c0c0c 0%,
    #2a2a2a 25%,
    #383838 45%,
    #2e2e2e 60%,
    #1a1a1a 80%,
    #111 100%
  );
  border-radius: 6px 0 0 6px;
  overflow: hidden;
}
.face-left::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(to bottom, transparent 5%, #383838 30%, #383838 70%, transparent 95%);
}

.btn-mute  { position: absolute; top: 86px;  right: 0; width: 3px; height: 18px; background: #1c1c1c; border-radius: 2px 0 0 2px; box-shadow: inset 0 1px 0 #2a2a2a; }
.btn-vol-u { position: absolute; top: 122px; right: 0; width: 3px; height: 40px; background: #1c1c1c; border-radius: 2px 0 0 2px; box-shadow: inset 0 1px 0 #2a2a2a; }
.btn-vol-d { position: absolute; top: 170px; right: 0; width: 3px; height: 40px; background: #1c1c1c; border-radius: 2px 0 0 2px; box-shadow: inset 0 1px 0 #2a2a2a; }

/* ── Right side ── */
.face-right {
  position: absolute;
  right: 0; top: 0;
  width: 30px; height: 440px;
  transform-origin: 100% 50% 0;
  transform: rotateY(90deg);
  background: linear-gradient(to left, #080808 0%, #1c1c1c 30%, #222 50%, #181818 100%);
  border-radius: 0 6px 6px 0;
  overflow: hidden;
}
.face-right::before {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(to bottom, transparent 5%, #282828 30%, #282828 70%, transparent 95%);
}
.btn-power { position: absolute; top: 136px; left: 0; width: 3px; height: 58px; background: #1c1c1c; border-radius: 0 2px 2px 0; box-shadow: inset 0 1px 0 #262626; }

/* ── Screen ── */
.screen {
  position: absolute; inset: 0;
  overflow: hidden; border-radius: 36px;
}
.screen::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 88px;
  background: linear-gradient(to bottom, #0f0f0f 32%, transparent);
  z-index: 10; pointer-events: none;
}
.screen::after {
  content: ''; position: absolute;
  bottom: 0; left: 0; right: 0; height: 80px;
  background: linear-gradient(to top, #0f0f0f 32%, transparent);
  z-index: 10; pointer-events: none;
}

/* Dynamic island — smaller, nudged down to sit clear of the top bezel */
.island {
  position: absolute;
  top: 16px;
  left: 50%; transform: translateX(-50%);
  width: 58px; height: 21px;
  background: #060606;
  border-radius: 10px;
  z-index: 20;
}

.home-bar {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  width: 90px; height: 4px;
  background: rgba(255,255,255,0.12); border-radius: 2px; z-index: 20;
}

/* ── Cards ── */
.track {
  padding: 60px 12px 20px;
  display: flex; flex-direction: column; gap: 8px;
  will-change: transform;
  animation: scroll 7s linear infinite;
}

.card {
  height: 56px;
  background: #181818; border: 1px solid #1e1e1e; border-radius: 15px;
  padding: 10px 11px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.svc-icon {
  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
}
.svc-info { flex: 1; min-width: 0; }
.svc-name   { font-size: 12px; font-weight: 600; color: #dedede; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.svc-days   { font-size: 10px; color: #383838; margin-top: 2px; }
.svc-amount { font-size: 12px; font-weight: 700; color: #dedede; white-space: nowrap; }

@keyframes scroll {
  from { transform: translateY(0); }
  to   { transform: translateY(-640px); }
}
</style>
</head>
<body>

<div class="outer">
  <div class="crop">
    <div class="scene">
      <div class="phone-box">

        <div class="face-top"></div>

        <div class="face-left">
          <div class="btn-mute"></div>
          <div class="btn-vol-u"></div>
          <div class="btn-vol-d"></div>
        </div>

        <div class="face-right">
          <div class="btn-power"></div>
        </div>

        <div class="face-front">
          <div class="island"></div>
          <div class="screen">
            <div class="track" id="track"></div>
          </div>
          <div class="home-bar"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Gradient fade sits outside clip-path scope -->
  <div class="fade-bottom"></div>
</div>

<script>
const services = [
  { letter: 'N', name: 'Netflix',  color: '#E50914', amount: '249 CZK', days: 'через 3 дн.' },
  { letter: 'S', name: 'Spotify',  color: '#1DB954', amount: '159 CZK', days: 'через 12 дн.' },
  { letter: 'i', name: 'iCloud',   color: '#0071E3', amount: '49 CZK',  days: 'через 5 дн.' },
  { letter: 'G', name: 'ChatGPT',  color: '#10A37F', amount: '590 CZK', days: 'через 18 дн.' },
  { letter: 'Y', name: 'YouTube',  color: '#FF4444', amount: '189 CZK', days: 'через 7 дн.' },
  { letter: 'F', name: 'Figma',    color: '#F24E1E', amount: '890 CZK', days: 'через 14 дн.' },
  { letter: 'D', name: 'Discord',  color: '#5865F2', amount: '99 CZK',  days: 'через 21 дн.' },
  { letter: 'N', name: 'Notion',   color: '#6366F1', amount: '349 CZK', days: 'через 9 дн.' },
  { letter: 'S', name: 'Slack',    color: '#E01E5A', amount: '420 CZK', days: 'через 2 дн.' },
  { letter: 'G', name: 'GitHub',   color: '#7C3AED', amount: '250 CZK', days: 'через 16 дн.' },
];

const track = document.getElementById('track');
[...services, ...services].forEach(s => {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="svc-icon" style="background:${s.color}18;color:${s.color}">${s.letter}</div>
    <div class="svc-info">
      <div class="svc-name">${s.name}</div>
      <div class="svc-days">${s.days}</div>
    </div>
    <div class="svc-amount">${s.amount}</div>
  `;
  track.appendChild(el);
});
</script>
</body>
</html>
